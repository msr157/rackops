name: CI — Web · Go · Docker

# ─────────────────────────────────────────────────────────────────────
# GitHub Actions CI/CD Pipeline — rackops monorepo
#
# Jobs (parallel):
#   web            → pnpm install + turbo lint/build (website + dashboards + packages)
#   go             → vet, build, and test the agent & control planes
#   docker-website → validate the production website image (the deploy gate)
#
# Branch strategy:
#   main        → CI + Dokploy deploys automatically via its GitHub webhook
#   qa          → CI only
#   development → CI only
# ─────────────────────────────────────────────────────────────────────

on:
  push:
    branches:
      - main
      - qa
      - development

jobs:
  web:
    name: Web — Lint & Build (pnpm + Turborepo)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: pnpm/action-setup@v4 # version read from packageManager field

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck & build all workspaces
        run: pnpm turbo run lint build

  go:
    name: Go — Vet, Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...

  docker-website:
    name: Docker — Website Image (deploy gate)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Build production image
        run: docker build -f apps/website/Dockerfile -t ci-validate:${{ github.sha }} .

      - name: Deployment handled by Dokploy
        if: github.ref == 'refs/heads/main'
        run: echo "✅ Dokploy will deploy automatically via GitHub Webhooks."

      - name: Deployment skipped
        if: github.ref != 'refs/heads/main'
        run: echo "ℹ️  Not on main — CI passed, deployment skipped."
